services:
  postgres:
    image: postgres:16-alpine
    container_name: phimheo-secure-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onlyheo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-onlyheo_secure}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onlyheo} -d ${POSTGRES_DB:-onlyheo_secure}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
